name: Release

# Composer packages are published by pushing a git tag that Packagist can resolve; Packagist then
# fetches that ref. This workflow asserts the tag is releasable and pokes Packagist to crawl it now
# instead of waiting for the GitHub webhook.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packagist:
    name: Verify and update packagist.org/packages/maukirim/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

      - name: Tag must be a semver release
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not a semver tag"
            exit 1
          fi

      - name: Submit and update the package on Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -eu
          repo='{"repository":{"url":"https://github.com/MauKirim/sdk-php"}}'
          api='https://packagist.org/api'

          # The first release has to create the package; later tags only need an update.
          create_code="$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            "${api}/create-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' -d "$repo")"
          echo "create-package -> HTTP $create_code"
          cat /tmp/create.json || true
          echo

          if [ "$create_code" != "200" ] && [ "$create_code" != "202" ]; then
            if grep -q 'already claimed' /tmp/create.json; then
              # Literal namespace: the secret is masked in annotations, which hides the URL otherwise.
              echo "::error::The 'maukirim' vendor namespace on Packagist is owned by another account." \
                "Either add the PACKAGIST_USERNAME account as a maintainer of" \
                "https://packagist.org/packages/maukirim/open-api (its current maintainer), or claim" \
                "the namespace at https://packagist.org/contact/vendor-claim?vendor=maukirim." \
                "Then re-run this job; no new tag is needed."
              exit 1
            fi
            echo "::notice::create-package returned $create_code; falling back to update-package"
          fi

          update_code="$(curl -sS -o /tmp/update.json -w '%{http_code}' -X POST \
            "${api}/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' -d "$repo")"
          echo "update-package -> HTTP $update_code"
          cat /tmp/update.json || true
          echo

          if [ "$update_code" != "200" ] && [ "$update_code" != "202" ]; then
            echo "::error::Packagist refused the update; see the response above."
            exit 1
          fi

          echo "Published: https://packagist.org/packages/maukirim/sdk"
